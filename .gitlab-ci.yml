# CI for the template (GitLab, gitlab.up.pt).
#   checks        every merge request and every push to main: generated files, types, build, docs site, tests
#   pages         after a push to main: the documentation website with the starter as demo/
#   release       after a vX.Y.Z tag: a GitLab release with the matching CHANGELOG.md section
# See "Checks before a merge request" and "Releasing a version" in docs/contributing.md.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never # a branch with an open merge request runs once, as the merge request
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

stages: [check, publish]

default:
  # Keep in step with .nvmrc. Debian, so Playwright can install Chromium's system libraries.
  image: node:24-bookworm
  interruptible: true
  cache:
    key:
      files: [package-lock.json]
    paths: [.npm/]
  before_script:
    - npm ci --cache .npm --prefer-offline

.checks:
  stage: check
  timeout: 30 minutes
  script:
    - npm run check:generated
    - npm run typecheck
    - npm run build
    # Fails on a broken link between pages, so the published site stays whole.
    - npx vitepress build docs
    - npx -w web-starter playwright install --with-deps --only-shell chromium
    - npm test
  artifacts:
    when: on_failure
    expire_in: 14 days
    paths: [apps/*/playwright-report/]

checks:
  extends: .checks

# The newest Node release is an early warning only.
checks-node-current:
  extends: .checks
  image: node:current-bookworm
  allow_failure: true

pages:
  stage: publish
  rules:
    # Only the template project publishes. In a copy, change the path to your project's to publish your own site.
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PROJECT_PATH == "inno-trec/inno-trec-web-template"
  script:
    # The site's path comes from the project's Pages address (a sub-path, or "/" with a unique domain).
    - export DOCS_BASE=$(node -p 'new URL(process.env.CI_PAGES_URL).pathname.replace(/\/?$/, "/")')
    - npm run pages:build
    - rm -rf public && mv docs/.vitepress/dist public
  artifacts:
    paths: [public]

release-notes:
  stage: check
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - |
      version="${CI_COMMIT_TAG#v}"
      pkg=$(node -p 'require("./package.json").version')
      if [ "$version" != "$pkg" ]; then echo "Tag $CI_COMMIT_TAG does not match package.json version $pkg"; exit 1; fi
      awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
      if [ ! -s notes.md ]; then echo "CHANGELOG.md has no section for [$version]"; exit 1; fi
  artifacts:
    paths: [notes.md]

release:
  stage: publish
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: $CI_COMMIT_TAG
  needs: [checks, release-notes]
  cache: []
  before_script: []
  script:
    - echo "Releasing $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    name: $CI_COMMIT_TAG
    description: ./notes.md
