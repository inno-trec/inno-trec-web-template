name: Pages

# Publishes the documentation and the demo to GitHub Pages after every change on main.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Only the template repository publishes. In a copy, delete this line to publish your own site,
    # and set DOCS_BASE below to "/<your-repository>/".
    if: github.event.repository.is_template
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOCS_BASE: /${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Build the site and the demo
        run: npm run pages:build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
